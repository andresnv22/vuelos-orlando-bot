name: Bot vuelos BOG-MCO

on:
  schedule:
    # GitHub no garantiza los horarios: retrasa y se salta muchas corridas (el 31/10 hizo 2 de 10).
    # Por eso se despierta cada media hora (6am a 9:59pm hora de Colombia = UTC - 5) y el paso
    # "¿Toca revisar?" deja seguir una sola revisión por franja de 3 horas (6-9, 9-12, 12-3, 3-6, 6-9, 9pm).
    # Si GitHub se salta una, la siguiente de la misma franja la recupera.
    # Minutos 7 y 37 y no en punto: a las horas en punto GitHub está más saturado.
    # El que de verdad lo despierta a tiempo es el push de abajo; este horario de GitHub queda de respaldo.
    - cron: "7,37 0-2,11-23 * * *"
  push:
    # Un despertador en la nube de Claude (rutina "Despertador bot vuelos") empuja un commit vacío a esta
    # rama a las 6, 9, 12, 3, 6 y 9 en punto. Los push sí llegan al instante, a diferencia del horario.
    branches: [claude/despertador]
  workflow_dispatch:
    inputs:
      modo:
        description: "normal, resumen, prueba, diagnostico (sin correo) o auto (como el horario: solo revisa si ya toca)"
        default: normal

permissions:
  contents: write  # para guardar estado.json (historial de precios) entre corridas

concurrency:
  group: bot-vuelos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-24.04  # fija: el 11/11 ubuntu-latest pasó a 26.04 y Playwright no instala Chromium ahí
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main  # siempre el código y el historial de main, aunque lo despierte un push a otra rama

      - name: ¿Toca revisar?
        id: toca
        env:
          TZ: America/Bogota
          EVENTO: ${{ github.event_name }}
          MODO: ${{ inputs.modo }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          ahora = datetime.now()
          revisiones = json.load(open("estado.json")).get("revisiones", [])
          ultima = datetime.fromisoformat(revisiones[-1]["fecha"]) if revisiones else None
          def franja(t):  # 6-9am, 9-12, 12-3pm, 3-6pm, 6-9pm y 9pm
              return t.date(), (t.hour - 6) // 3
          if os.environ["EVENTO"] == "workflow_dispatch" and os.environ["MODO"] != "auto":
              si = True  # corrida lanzada a mano
          else:
              # Una revisión por franja (antes era "2h40 desde la última", y una revisión a mano a la 1pm hacía
              # saltar la de las 3pm). La hora mínima entre revisiones evita dos seguidas en el cambio de franja.
              si = 6 <= ahora.hour <= 21 and (ultima is None or (
                  franja(ahora) != franja(ultima) and ahora - ultima >= timedelta(hours=1)))
          print(f"Ahora {ahora:%d/%m %H:%M}, última revisión {ultima:%d/%m %H:%M}" if ultima else "Sin revisiones")
          print("Toca revisar" if si else "Todavía no toca; se espera a la próxima")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"si={'true' if si else 'false'}\n")
          PY

      - uses: actions/setup-python@v6
        if: steps.toca.outputs.si == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias y Chromium
        if: steps.toca.outputs.si == 'true'
        run: |
          pip install -r requirements.txt
          # A veces los servidores de paquetes de Ubuntu no responden (falló así el 11/11 a las 9am): se reintenta.
          for intento in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "La instalación falló (intento $intento); se reintenta en 30 segundos"
            sleep 30
          done
          exit 1

      - name: Revisar precios
        if: steps.toca.outputs.si == 'true'
        env:
          AVISAR_POR: gmail
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}  # opcional: a dónde llegan los avisos (si no, a GMAIL_USER)
          TZ: America/Bogota
          MODO: ${{ inputs.modo }}
          CAPTURAS: capturas  # lo que mostraba Google cuando no salió un link de reserva
        run: |
          case "$MODO" in
            resumen) python bot_vuelos.py --resumen ;;
            prueba) python bot_vuelos.py --probar-aviso ;;
            diagnostico) python diagnostico.py ;;  # abre la reserva de cada fecha, sin correo ni historial
            *) python bot_vuelos.py ;;
          esac

      - name: Subir capturas de lo que falló
        if: always() && steps.toca.outputs.si == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar historial de precios
        if: always() && steps.toca.outputs.si == 'true'
        run: |
          git config user.name "bot-vuelos"
          git config user.email "bot-vuelos@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar historial de precios"
          # Si el repositorio cambió mientras corría el bot, se trae el cambio y se reintenta.
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
