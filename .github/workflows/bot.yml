name: Bot vuelos BOG-MCO

on:
  schedule:
    # 6am, 9am, 12m, 3pm, 6pm y 9pm hora de Colombia (GitHub usa hora UTC = Colombia + 5)
    - cron: "0 2,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal, resumen o prueba"
        default: normal

permissions:
  contents: write  # para guardar estado.json (historial de precios) entre corridas

concurrency:
  group: bot-vuelos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: Revisar precios
        env:
          AVISAR_POR: gmail
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}  # opcional: a dónde llegan los avisos (si no, a GMAIL_USER)
          TZ: America/Bogota
          MODO: ${{ inputs.modo }}
        run: |
          case "$MODO" in
            resumen) python bot_vuelos.py --resumen ;;
            prueba) python bot_vuelos.py --probar-aviso ;;
            *) python bot_vuelos.py ;;
          esac

      - name: Guardar historial de precios
        if: always()
        run: |
          git config user.name "bot-vuelos"
          git config user.email "bot-vuelos@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Actualizar historial de precios" && git push)
