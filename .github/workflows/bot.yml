name: Bot vuelos BOG-MCO

on:
  schedule:
    # Cada 2 horas de 6am a 10pm hora de Colombia (GitHub usa hora UTC = Colombia + 5).
    # Minuto 23 y no en punto: a las horas en punto GitHub está saturado y retrasa o se salta corridas.
    - cron: "23 1,3,11,13,15,17,19,21,23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal, resumen o prueba"
        default: normal

permissions:
  contents: write  # para guardar estado.json (historial de precios) entre corridas

concurrency:
  group: bot-vuelos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar precios
        env:
          AVISAR_POR: gmail
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}  # opcional: a dónde llegan los avisos (si no, a GMAIL_USER)
          TZ: America/Bogota
          MODO: ${{ inputs.modo }}
        run: |
          case "$MODO" in
            resumen) python bot_vuelos.py --resumen ;;
            prueba) python bot_vuelos.py --probar-aviso ;;
            *) python bot_vuelos.py ;;
          esac

      - name: Guardar historial de precios
        if: always()
        run: |
          git config user.name "bot-vuelos"
          git config user.email "bot-vuelos@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar historial de precios"
          # Si el repositorio cambió mientras corría el bot, se trae el cambio y se reintenta.
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
